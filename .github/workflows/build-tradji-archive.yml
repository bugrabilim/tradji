name: Build Tradji archive

on:
  push:
    branches: [main]
    paths:
      - 'archive/generate_mockups.py'
      - 'archive/generate_presentations.py'
      - 'archive/build_archive.py'
      - '.github/workflows/build-tradji-archive.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install python-pptx Pillow

      - name: Generate mockups
        run: python archive/generate_mockups.py

      - name: Generate presentations
        run: python archive/generate_presentations.py

      - name: Pack archive
        run: python archive/build_archive.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/artifacts archive/Tradji_Gorusme_Arsivi.zip
          if git diff --cached --quiet; then
            echo "Generated files already up to date."
          else
            git commit -m "Build Tradji conversation archive [skip ci]"
            git push
          fi
